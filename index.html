.row-in{display:grid;grid-template-columns:1fr 6.5rem;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}

 {e:'Lactancia (con la madre)',d0:0,d1:29,a:'Preiniciador',kg:0.03},

/* ============ datos (Google Sheets en tu Drive, con copia en el celular) ============ */

var ui={tab:'inicio',det:null,granja:'todas',per:'anio',filtro:'todas'};
var SEED={"granjas": {"g1": {"nombre": "El Progreso", "ubicacion": "Villa Claudia"}}, "cerdas": {"c01": {"granja": "g1", "codigo": "C01", "nombre": "Grande 1", "tipo": "Madre", "raza": "", "nac": "2025-12-28", "origen": "Compra", "estadoFicha": "Activa", "valorCompra": 200000, "creado": 1}, "c02": {"granja": "g1", "codigo": "C02", "nombre": "Grande 2", "tipo": "Madre", "raza": "", "nac": "2025-12-28", "origen": "Compra", "estadoFicha": "Activa", "valorCompra": 200000, "creado": 2}, "c03": {"granja": "g1", "codigo": "C03", "nombre": "Grande 3", "tipo": "Madre", "raza": "", "nac": "2025-12-28", "origen": "Compra", "estadoFicha": "Activa", "valorCompra": 200000, "creado": 3}, "c04": {"granja": "g1", "codigo": "C04", "nombre": "Grande 4", "tipo": "Madre", "raza": "", "nac": "2025-12-28", "origen": "Compra", "estadoFicha": "Activa", "valorCompra": 200000, "creado": 4}, "c05": {"granja": "g1", "codigo": "C05", "nombre": "Duroc", "tipo": "Madre", "raza": "Duroc", "nac": "2026-02-12", "origen": "Compra", "estadoFicha": "Activa", "valorCompra": 200000, "creado": 5}}, "ciclos": {"ci01": {"granja": "g1", "cerda": "c01", "num": 1, "servicio": "2026-11-07", "tipoS": "Inseminación", "resultado": "Pendiente"}, "ci05": {"granja": "g1", "cerda": "c05", "num": 1, "servicio": "2026-11-07", "tipoS": "Inseminación", "resultado": "Pendiente"}}};
try{var c0=JSON.parse(localStorage.getItem(LSK)||'null');if(c0){COLS.forEach(function(c){S[c]=(c0.S&&c0.S[c])||{};T[c]=(c0.T&&c0.T[c])||{};});dirty=c0.dirty||{};SHEET=c0.sheet||'';PROV=c0.prov||(SHEET?'google':'');if(c0.msf)MSF=c0.msf;lastSync=c0.lastSync||0;AUTH.email=c0.email||'';AUTH.name=c0.name||'';if(c0.ui)ui.granja=c0.ui.granja||'todas';}}catch(e){}

var tokenClient=null,tokenWaiters=[];

  if(st.e==='Gestante'){r.a=M.a;if(st.dia<=84){r.etapa='Gestación 1 (día 1–84)';r.kg=M.gest1;}else{r.etapa='Gestación 2 (día 85–114)';r.kg=M.gest2;}}

  else if(st.e==='Vacía'){r.a=M.a;r.etapa='Vacía, esperando celo';r.kg=M.vacia;r.nota='Un poco más de comida (flushing) ayuda a que entre en celo.';}
  else if(st.e==='Relevo'){if(ed!=null&&ed<=213){var nm=normaEdad(ed);r.a=nm.a;r.etapa='Relevo · '+nm.e;r.kg=nm.kg;}else{r.a=M.a;r.etapa='Relevo, preparando primer servicio';r.kg=M.relevo;}}
  else if(st.e==='Descarte'){r.a=M.a;r.etapa='Descarte';r.kg=M.descarte;}
  if(pe&&(st.e==='Gestante'||st.e==='Vacía'||st.e==='Relevo')){
    if(pe.estado==='Bajo'){r.kg+=0.3;r.nota='Peso bajo para su edad: se suben 300 g diarios.';}
    else if(pe.estado==='Alto'&&st.e==='Gestante'){r.kg-=0.2;r.nota='Peso alto para su edad: se bajan 200 g diarios.';}
  }
  r.kg=Math.round(r.kg*100)/100;return r;
}
function racionLote(l){
  var cab=cabezasLote(l),ed=edadDias(l.nac);if(l.estado==='Cerrado'||cab<=0||ed==null)return {etapa:'',a:'',kgA:0,kg:0,cab:cab,ed:ed};
  var nm=normaEdad(ed),a=nm.a,et=nm.e,pr=infoPesoLote(l);
  if(pr&&ed>=LACT&&!(S.config&&S.config.normas)){for(var i=0;i<POR_PESO.length;i++)if(pr.kg>=POR_PESO[i][0]){if(POR_PESO[i][1]!==a){a=POR_PESO[i][1];et=a+' (por peso: '+n1(pr.kg)+' kg promedio)';}break;}}
  return {etapa:et,a:a,kgA:nm.kg,kg:Math.round(nm.kg*cab*100)/100,cab:cab,ed:ed};
}
function infoPesoLote(l){var p=ultimoPeso(l.id);if(!p||!l.nac||!(+p.cabezas))return null;var avg=+p.kg/+p.cabezas,d=edadDias(l.nac,parse(p.fecha));var ev=evalPeso(avg,d);ev.kg=avg;ev.fecha=p.fecha;ev.dias=d;return ev;}

/* agenda de una cerda */
function eventosCerda(c){
  var st=estadoCerda(c),ev=[],u=st.ciclo;
  if(st.e==='Fuera'||st.e==='Descarte')return ev;
  if(st.e==='Gestante'){var s=parse(u.servicio);
    var coli=regs('sanidad',c.id).filter(function(r){return /coli/i.test(r.producto||'')&&r.fecha>=u.servicio;}).length;
    var desp=regs('sanidad',c.id).filter(function(r){return r.tipoS==='Desparasitante'&&r.fecha>=u.servicio;}).length;
    ev.push({t:'Revisar si repite celo',d:add(s,18),k:'celo'});
    if(u.resultado!=='Preñada')ev.push({t:'Ecografía de confirmación',d:add(s,25),k:'eco'});
    ev.push({t:'Vacuna E. coli · 1.ª dosis',d:add(s,70),k:'coli1',hecho:coli>=1});
    ev.push({t:'Vacuna E. coli · 2.ª dosis',d:add(s,95),k:'coli2',hecho:coli>=2});
    ev.push({t:'Desparasitar',d:add(s,100),k:'desp',hecho:desp>=1});
    ev.push({t:'Pasar a paridera',d:add(s,107),k:'paridera'});
    ev.push({t:'Parto estimado',d:add(s,GEST),k:'parto'});
  }
  if(st.e==='Lactante'){var p=parse(u.parto);
    ev.push({t:'Hierro a los lechones',d:add(p,3),k:'hierro',hecho:sanCount(c.id,'Hierro',u.parto)>0});
    var sc=sexoCamada(u);if(!sc||sc.m>0)ev.push({t:'Castrar machos',d:add(p,7),k:'castra',hecho:sanCount(c.id,'Castración',u.parto)>0});
    ev.push({t:'Vacunar lechones (Mycoplasma / Circovirus)',d:add(p,21),k:'vaclech',hecho:regs('sanidad',c.id).filter(function(r){return r.tipoS==='Vacuna'&&r.fecha>=iso(add(p,10));}).length>0});
    ev.push({t:'Destete',d:add(p,LACT),k:'destete'});
  }
  if(st.e==='Vacía'){
    if(st.desde==='destete'){ev.push({t:'Celo esperado (servir)',d:add(parse(u.destete),5),k:'servir'});}
    else if(st.desde==='repitio'){var s2=parse(u.servicio),k=1;while(add(s2,21*k)<add(today(),-2))k++;ev.push({t:'Celo esperado (servir)',d:add(s2,21*k),k:'servir'});}
  }
  return ev;
}
function proximosEventos(dias){
  var out=[],t=today(),lim=add(t,dias),desde=add(t,-3);
  cerdas().forEach(function(c){eventosCerda(c).forEach(function(e){if(!e.hecho&&e.d>=desde&&e.d<=lim)out.push({act:'cerda',id:c.id,quien:c.codigo+' · '+(c.nombre||''),e:e});});});
  lotes().forEach(function(l){eventosLote(l).forEach(function(e){if(!e.hecho&&e.d>=desde&&e.d<=lim)out.push({act:'lote',id:l.id,quien:'Lote '+l.codigo,e:e});});});
  regs('sanidad').forEach(function(r){if(r.proxima&&enGranja(r)){var d=parse(r.proxima);if(d>=desde&&d<=lim){var es=S.cerdas[r.ref]?'cerda':(S.lotes[r.ref]?'lote':'');var who=es==='cerda'?S.cerdas[r.ref].codigo:(es==='lote'?'Lote '+S.lotes[r.ref].codigo:'');out.push({act:es,id:r.ref,quien:who,e:{t:'Próxima dosis: '+(r.producto||r.tipoS),d:d}});}}});
  return out.sort(function(a,b){return a.e.d-b.e.d;});
}
function evItem(x){return '<button class="item" '+(x.act?'data-act="'+x.act+'" data-id="'+x.id+'"':'')+'><span class="t">'+esc(x.e.t)+'</span><span class="r">'+fd(x.e.d)+'</span><span class="s">'+esc(x.quien)+' · '+rel(x.e.d)+'</span></button>';}
function cuandoInseminar(){
  var out=[],t=today();
  cerdas().forEach(function(c){
    var st=estadoCerda(c),ed=edadDias(c.nac),pe=pesoCerda(c);
    if(st.e==='Vacía'){var e=eventosCerda(c)[0];
      out.push({c:c,d:e?e.d:t,txt:e?(st.desde==='destete'?'4 a 7 días después del destete':'21 días después del último servicio'):'Vigilar celo mañana y tarde',pri:1});}
    else if(st.e==='Relevo'){
      var faltaD=ed==null?null:EDMIN-ed, okP=pe&&pe.kg>=PESMIN;
      if(ed!=null&&faltaD<=0&&okP)out.push({c:c,d:t,txt:'Lista: servir en el próximo celo'+(pe.estimado?' (peso estimado; confírmalo pesándola)':''),pri:0});
      else{var d=ed==null?null:add(t,Math.max(0,faltaD));out.push({c:c,d:d,txt:(ed==null?'Falta fecha de nacimiento':(faltaD>0?'Cumple edad el '+fd(d):'Ya tiene la edad'))+(pe?(okP?'':' · '+(pe.estimado?'~':'')+n0(pe.kg)+' kg de '+PESMIN+(pe.estimado?' (estimado)':'')):''),pri:2});}
    }
    else if(st.e==='Gestante'){var p=add(parse(st.ciclo.servicio),GEST);out.push({c:c,d:add(p,LACT+5),txt:'Después del parto ('+fd(p)+') y destete',pri:3});}
    else if(st.e==='Lactante'){out.push({c:c,d:add(parse(st.ciclo.parto),LACT+5),txt:'Después del destete',pri:3});}
  });
  return out.sort(function(a,b){return a.pri-b.pri||((a.d||0)-(b.d||0));});
}
function recomendacionCerda(c){
  var cs=ciclosDe(c.id),partos=cs.filter(function(x){return x.parto;}),rep=cs.filter(function(x){return x.resultado==='Repitió';}).length;
  var pv=partos.length?partos.reduce(function(s,x){return s+(+x.vivos||0);},0)/partos.length:null;
  if(c.estadoFicha==='Descarte')return {t:'Programar la venta',k:'warn'};
  if(partos.length>=PMAX)return {t:'Evaluar descarte: ya tiene '+partos.length+' partos',k:'warn'};
  if(partos.length>=2&&pv<8)return {t:'Evaluar descarte: camadas pequeñas ('+n1(pv)+' vivos en promedio)',k:'warn'};
  if(rep>=2)return {t:'Evaluar descarte: ha repetido celo '+rep+' veces',k:'warn'};
  return null;
}

function presupuesto(){
  var m={};TIPOS.forEach(function(t){m[t]={dia:0,grupos:[]};});
  cerdas().forEach(function(c){var st=estadoCerda(c);if(st.e==='Lactante'){var nl=lechonesLactando(st.ciclo);var nm0=normaEdad(Math.max(0,st.dia-1));if(nl>0&&st.dia>=7&&m[nm0.a]){m[nm0.a].dia+=nm0.kg*nl;m[nm0.a].grupos.push({ref:c.id,n:'Camada de '+c.codigo+' · '+nl+' lechones',kg:Math.round(nm0.kg*nl*100)/100,neg:'Cría',granja:c.granja});}}});
  cerdas().forEach(function(c){var r=racionCerda(c);if(r.kg>0){m[r.a].dia+=r.kg;m[r.a].grupos.push({ref:c.id,n:c.codigo+' · '+(c.nombre||''),kg:r.kg,neg:'Cría',granja:c.granja});}});
  lotes().forEach(function(l){var r=racionLote(l);if(r.kg>0){m[r.a].dia+=r.kg;m[r.a].grupos.push({ref:l.id,n:l.codigo+' · '+r.cab+' cerdos',kg:r.kg,neg:l.negocio,granja:l.granja});}});
  return m;
}
function inventario(){
  var m={};TIPOS.forEach(function(t){m[t]={kg:0,valor:0,kgAll:0,valAll:0,cons:0,real7:0};});
  var t7=iso(add(today(),-6));
  regs('compra').forEach(function(r){var kg=(+r.bultos||0)*(+r.kgBulto||KGB);if(!m[r.alimento])return;m[r.alimento].kgAll+=kg;m[r.alimento].valAll+=(+r.valor||0);if(enGranja(r)){m[r.alimento].kg+=kg;m[r.alimento].valor+=(+r.valor||0);}});
  regs('consumo').forEach(function(r){if(!m[r.alimento]||!enGranja(r))return;m[r.alimento].cons+=(+r.kg||0);if(r.fecha>=t7)m[r.alimento].real7+=(+r.kg||0);});
  TIPOS.forEach(function(t){var x=m[t];x.stock=x.kg-x.cons;x.costoKg=x.kgAll?x.valAll/x.kgAll:0;});
  return m;
}
function necesidadCamadas(){
  var m={};TIPOS.forEach(function(t){m[t]=0;});
  cerdas().forEach(function(c){var st=estadoCerda(c);if(st.e!=='Gestante')return;
    var M=MAD();m[M.a]+=(M.lactBase+M.lactLechon*LECH)*LACT;NORMAS().forEach(function(nm){var d1=Math.min(nm.d1,213);m[nm.a]+=nm.kg*(d1-nm.d0+1)*LECH;});});
  return m;
}

function vInicio(){
  var cs=cerdas(),cnt={Gestante:0,Lactante:0,'Vacía':0,Relevo:0};
  cs.forEach(function(c){var e=estadoCerda(c).e;if(cnt[e]!=null)cnt[e]++;});
  var lt=lotes(),cria=0,eng=0;lt.forEach(function(l){var n=cabezasLote(l);if(l.negocio==='Engorde')eng+=n;else cria+=n;});
  cs.forEach(function(c){var st=estadoCerda(c);if(st.e==='Lactante')cria+=lechonesLactando(st.ciclo);});
  var h='<div class="card"><div class="card-h"><span class="label">Hato</span><span class="note">'+cs.length+' hembras · '+(cria+eng)+' cerdos</span></div><div class="stats">';
  [['Gestante','Gestantes'],['Lactante','Lactantes'],['Vacía','Vacías'],['Relevo','Relevos']].forEach(function(x){h+='<button class="stat" data-act="filtro" data-v="'+x[0]+'"><b>'+cnt[x[0]]+'</b><span>'+x[1]+'</span></button>';});
  h+='</div><div class="stats"><button class="stat" data-tab="lotes"><b>'+cria+'</b><span>Lechones</span></button><button class="stat" data-tab="lotes"><b>'+eng+'</b><span>En engorde</span></button>';
  var parto30=cs.filter(function(c){var st=estadoCerda(c);if(st.e!=='Gestante')return false;var p=add(parse(st.ciclo.servicio),GEST);return diff(today(),p)<=30;}).length;
  h+='<button class="stat" data-act="rep" data-v="agenda"><b>'+parto30+'</b><span>Partos 30 días</span></button><button class="stat" data-act="rep" data-v="inseminar"><b>'+cuandoInseminar().filter(function(x){return x.pri<=1;}).length+'</b><span>Para servir</span></button></div></div>';
  // alertas

function guardarArchivo(nombre,data){var tipo=/\.ics$/.test(nombre)?'text/calendar':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';var b=new Blob([data],{type:tipo}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},2000);toast('Descargando '+nombre);}
function icsFecha(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}

  L.push('END:VCALENDAR');guardarArchivo('pig-app-agenda.ics',L.join('\r\n'));}

function hojasLegibles(){

  var al=TIPOS.map(function(t){var p=pre[t].dia,x=inv[t];return {Alimento:t,Kg_dia:Math.round(p*10)/10,Kg_semana:Math.round(p*70)/10,Inventario_kg:Math.round(x.stock),Dias_que_alcanza:p>0?Math.floor(Math.max(0,x.stock)/p):'',Bultos_a_comprar_30_dias:p>0?Math.max(0,Math.ceil((p*30-Math.max(0,x.stock))/KGB)):0,Costo_kg:esDueno?Math.round(x.costoKg):''};});

  return [['Cerdas',cer],['Ciclos',cic],['Lotes',lot],['Registros',rg],['Alimento',al],['Indicadores',ind]];}
